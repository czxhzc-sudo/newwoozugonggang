spring.application.name=woojugonggang

# Local defaults are for development only. Configure DB_URL, DB_USERNAME, DB_PASSWORD
# as environment variables in the deployment platform.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/teamjavaprogramming}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# Render and other platforms provide PORT; local development defaults to 8080.
server.port=${PORT:8080}
